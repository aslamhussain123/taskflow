
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      # Use the local Ollama container so AI requests do not consume cloud credits.
      - OLLAMA_API_KEY=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=qwen3:1.7b
    depends_on:
      ollama-model:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    container_name: taskflow-ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Pull the lightweight model once before starting the API container.
  ollama-model:
    image: ollama/ollama:latest
    container_name: taskflow-ollama-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["ollama"]
    command: ["pull", "qwen3:1.7b"]
    restart: "no"

volumes:
  ollama-data:
